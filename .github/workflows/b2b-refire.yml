{"name":"Alfa by-store re-pull (date range)","on":{"workflow_dispatch":{"inputs":{"start":{"description":"Start date YYYY-MM-DD","required":true,"type":"string"},"end":{"description":"End date YYYY-MM-DD","required":true,"type":"string"},"brand":{"description":"Which chain: both, alfamart or alfamidi","required":false,"default":"both","type":"choice","options":["both","alfamart","alfamidi"]}}}},"permissions":{"contents":"read"},"concurrency":{"group":"b2b-refire","cancel-in-progress":false},"env":{"TZ":"Asia/Jakarta","PYTHONIOENCODING":"utf-8","ALFAMART_B2B_USER":"${{ secrets.ALFAMART_USERNAME }}","ALFAMART_B2B_PASS":"${{ secrets.ALFAMART_PASSWORD }}","ALFAMART_TOTP_SECRET":"${{ secrets.ALFAMART_TOTP_SECRET }}","B2B_MIDI_USER":"${{ secrets.ALFAMIDI_USERNAME }}","B2B_MIDI_PASS":"${{ secrets.ALFAMIDI_PASSWORD }}","START":"${{ inputs.start }}","END":"${{ inputs.end }}"},"jobs":{"refire":{"runs-on":"ubuntu-latest","timeout-minutes":30,"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.13","cache":"pip"}},{"run":"pip install -r requirements.txt"},{"name":"Alfamart by-store","run":"python -u sources/alfamart_b2b_auto.py --only by-store --start \"$START\" --end \"$END\" --confirm","if":"${{ inputs.brand != 'alfamidi' }}"},{"name":"Alfamidi by-store","if":"${{ !cancelled() && inputs.brand != 'alfamart' }}","run":"python -u sources/alfamidi_b2b_auto.py --only by-store --start \"$START\" --end \"$END\" --confirm"}]}}}